name: 🧹 Lint Templates

on:
  pull_request:
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:

jobs:
  lint:
    name: Check template syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget

      - name: Extract only bin/ from xbps-static
        run: |
          cd /tmp
          FILE="xbps-static-0.59.1_5.x86_64-musl.tar.gz"
          URL="https://repo-default.voidlinux.org/static/$FILE"

          wget --no-check-certificate -q --show-progress "$URL" -O "$FILE" || \
          { echo "❌ Failed to download $URL"; exit 1; }

          # Создадим папку /tmp/bin
          mkdir -p /tmp/bin

          # Извлечём ТОЛЬКО бинарники, убрав лишнюю директорию
          tar -xzf "$FILE" --strip-components=1 -C /tmp/bin bin/xbps-uhelper bin/xbps-install

          # Проверим
          /tmp/bin/xbps-uhelper --help

          # Добавим в PATH
          echo "/tmp/bin" >> $GITHUB_PATH
          
      - name: Download xlint.sh
        run: |
          wget https://raw.githubusercontent.com/void-linux/void-packages/master/common/travis/xlint.sh -O xlint.sh
          chmod +x xlint.sh

      - name: Run xlint on changed templates
        run: |
          templates=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'srcpkgs/.*/template' || echo "")
          if [ -n "$templates" ]; then
            echo "🔍 Checking templates:"
            echo "$templates"
            echo "$templates" | xargs ./xlint.sh
          else
            echo "✅ No template files changed."
          fi
