name: 🏗️ Build Packages 2 (xbps)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x86_64, host: x86_64, libc: glibc, platform: linux/amd64 }
          # - { arch: i686,         host: i686,        libc: glibc, platform: linux/386 }
          # - { arch: x86_64-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64 }

    container:
      image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full:20250616R1
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: ${{ matrix.config.arch }}
        XBPS_TARGET_ARCH: ${{ matrix.config.arch }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}

    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      # --- Подготовка контейнера ---
      - name: 🧰 Prep container & user
        run: |
          xbps-install -Syu xbps
          xbps-install -y bash curl jq zip unzip git xtools coreutils sudo
          
          id -u builder &>/dev/null || useradd -G xbuilder -M builder -s $(which bash)
          
          mkdir -p /home/builder/.xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /home/builder/.xbps.d/
          chown -R builder:builder /home/builder

      # --- Клонируем код ---
      - name: 🔎 Checkout this repo and void-packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          fetch-depth: 0

      - name: 🐛 Fix sourcepkg.sh
        working-directory: void-packages
        run: |
          sed -i "s@for var in \$(awk .*;@for var in \$(printenv | cut -d'=' -f1);@" common/environment/setup/sourcepkg.sh

      - name: 🧩 Merge custom templates into void-packages
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          
          git remote add mine https://github.com/${{ github.repository }}.git || true
          git fetch mine main --depth=1
          
          if git rev-parse --verify mine/main >/dev/null 2>&1; then
            git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change mine/main
          fi
          
          mkdir -p hostdir/binpkgs
          
          gh release download --pattern "*${ARCH}*" --dir hostdir/binpkgs --repo ${{ github.repository }} || true

          if [ "$ARCH" = "x86_64" ]; then
            rm --force hostdir/binpkgs/*x86_64-musl* || true
          elif [ "$ARCH" = "x86_64-musl" ]; then
            rm --force hostdir/binpkgs/*x86_64.xbps || true
          fi
          rm --force hostdir/binpkgs/*.xbps.sig2 || true
          
      # --- Определяем список пакетов ---
      - name: 📋 Identify changes to build
        working-directory: void-packages
        id: identify
        run: |
          set -e
          
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            BASE_SHA="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          else
            BASE_SHA=$(git rev-list -n 1 "$LATEST_TAG")
          fi
          
          CURRENT_SHA="${{ github.sha }}"
          
          echo "Comparing range: $BASE_SHA..$CURRENT_SHA"
          
          CHANGED_PKGS=$(git diff-tree -r --no-renames --name-only --diff-filter=AM $BASE_SHA $CURRENT_SHA -- 'srcpkgs/**' \
            | cut -d/ -f 2 | sort -u)
            
          if [ -z "$CHANGED_PKGS" ]; then
            echo "No template files changed according to git tree."
            touch /tmp/templates_empty
            exit 0
          fi
          
          echo "📝 Raw changed packages:"
          echo "$CHANGED_PKGS"
          
          printf "%s\n" $CHANGED_PKGS | ./xbps-src sort-dependencies | tee /tmp/templates

      - name: 🧹 Clean outdated .xbps for changed packages
        working-directory: void-packages
        if: steps.identify.outputs.changed_pkgs != ''
        run: |
          if [ ! -f /tmp/templates ]; then echo "Nothing to clean."; exit 0; fi
          
          echo "📋 Packages to purge from binpkgs:"
          cat /tmp/templates
          
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "🧹 Purging old artifacts for $pkg..."
            find hostdir/binpkgs -maxdepth 1 -type f -name "${pkg}-*.xbps" -delete
            find hostdir/binpkgs -maxdepth 1 -type f -name "${pkg}-*.sig2" -delete
          done < /tmp/templates
          
      # --- Настройка окружения xbps-src ---
      - name: 🛠️ Setup void-packages conf
        working-directory: void-packages
        run: |
          mkdir -p etc
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo 'XBPS_REPOSITORY=$PWD/hostdir/binpkgs' >> etc/conf
          echo 'XBPS_DISTDIR=$PWD/hostdir/distfiles' >> etc/conf
          echo 'XBPS_MASTERDIR_PKGS="$PWD/hostdir/binpkgs"' >> etc/conf

      - name: 🔧 Prepare masterdir
        working-directory: void-packages
        run: |
          yes | ./xbps-src -m masterdir-${ARCH} -A ${ARCH} binary-bootstrap

      - name: ✅ Install gawk in chroot
        working-directory: void-packages
        run: |
          MASTERDIR="masterdir-${ARCH}"
          sudo mkdir -p "$MASTERDIR/etc/xbps.d"
          [ -d "/usr/share/xbps.d" ] && sudo cp /usr/share/xbps.d/*-repository-*.conf "$MASTERDIR/etc/xbps.d/" || true
          
          sudo mount --bind /proc "$MASTERDIR/proc" || true
          sudo mount --bind /dev "$MASTERDIR/dev" || true
          sudo mount --bind /sys "$MASTERDIR/sys" || true
          
          yes | sudo chroot "$MASTERDIR" xbps-install -y gawk
          
          if [ ! -L "$MASTERDIR/usr/bin/awk" ] && [ ! -f "$MASTERDIR/usr/bin/gawk" ]; then
            echo "❌ awk not found after install"; 
            sudo umount "$MASTERDIR"/proc "$MASTERDIR"/dev "$MASTERDIR"/sys 2>/dev/null; 
            exit 1; 
          fi
          
          sudo umount "$MASTERDIR"/proc "$MASTERDIR"/dev "$MASTERDIR"/sys 2>/dev/null || true

      - name: 🗑️ Reset package cache & sync repos
        working-directory: void-packages
        run: ./xbps-src clean-all || true

      # --- Сборка ---
      - name: 📦 Build pkgs
        working-directory: void-packages
        if: success() && !steps.identify.outcome == 'skipped'
        run: |
          if [ ! -f /tmp/templates ]; then echo "✨ No templates to build."; exit 0; fi
          
          echo "🏗️ Building list:"
          cat /tmp/templates
          
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "🏗️ Building $pkg for $ARCH..."
            ./xbps-src -f pkg -j$(nproc) -m masterdir-${ARCH} -A ${ARCH} "$pkg" || echo "Failed building ${pkg}, continuing..."
          done < /tmp/templates
          
      - name: 📊 Report what was built
        working-directory: void-packages/hostdir/binpkgs
        run: |
          shopt -s nullglob
          count=( *.xbps )
          echo "=== Built ${#count[@]} packages ==="
          ls -1 *.xbps | sort

      - name: 📦 Sign & Index repo
        working-directory: void-packages/hostdir/binpkgs
        env:
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
        run: |
          set -euo pipefail
          export PATH="/opt/xbps/usr/bin/:$PATH"

          rm -f *-repodata
          
          shopt -s nullglob
          files=( *.xbps )
          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠️ No .xbps files found. Skipping indexing."
            exit 0
          fi

          echo "✅ Found ${#files[@]} packages. Building new repodata..."
          xbps-rindex -a "${files[@]}"

          if [ -n "$PRIV_KEY" ]; then
            KEY_PATH="/dev/shm/private.pem"
            printf "%s\n" "$PRIV_KEY" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"

            xbps-rindex -r "$PWD"
            xbps-rindex -s --signedby "CI Bot <ci@example>" --privkey "$KEY_PATH" "$PWD"
            xbps-rindex -S --privkey "$KEY_PATH" "$PWD"/*.xbps
            xbps-rindex -c "$PWD"
            
            trap 'rm -f "$KEY_PATH"' EXIT ERR INT TERM
          else
            echo "⚠️ No PRIV_KEY — skipping signing."
          fi

          echo "✅ Repodata rebuilt."
          
      - name: 🔢 Checksum
        working-directory: void-packages/hostdir/binpkgs
        run: |
          shopt -s nullglob
          for file in *.xbps; do
            sha256sum "$file" | cut -d ' ' -f 1 > "${file}.sha256sum"
            sha512sum "$file" | cut -d ' ' -f 1 > "${file}.sha512sum"
          done
          
      - name: ⬇️ Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: void-packages/hostdir/binpkgs
          retention-days: 5

      - name: 📤 Upload to Release
        if: github.ref == 'refs/heads/main'
        working-directory: void-packages/hostdir/binpkgs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${ARCH}-latest"
          NAME="Binary repo for $ARCH Latest"
          
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          API="https://api.github.com/repos/${{ github.repository }}"

          EXISTING_RELEASE=$(curl -s -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/$TAG" || echo "")
          if echo "$EXISTING_RELEASE" | grep -q '"id":'; then
            RELEASE_ID=$(echo "$EXISTING_RELEASE" | jq -r '.id')
            echo "🗑️ Deleting old release ID $RELEASE_ID..."
            curl -s -X DELETE -H "$AUTH" -H "$ACCEPT" "$API/releases/$RELEASE_ID" || true
          fi

          CREATE_BODY=$(jq -n --arg tag "$TAG" --arg commit "${{ github.sha }}" --arg name "$NAME" \
            '{tag_name: $tag, target_commitish: $commit, name: $name, draft: false, prerelease: false}')
            
          NEW_RELEASE=$(curl -s -X POST -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" \
            -d "$CREATE_BODY" "$API/releases")
            
          RELEASE_ID=$(echo "$NEW_RELEASE" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "❌ Failed to create release:"; echo "$NEW_RELEASE"; exit 1; fi

          echo "✅ Release created: ID $RELEASE_ID"

          shopt -s nullglob
          for file in *.xbps *.sig2 *-repodata; do
            if [ -f "$file" ]; then
              echo "📤 Uploading $file..."
              curl -s -L -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$file" \
                --fail
            fi
          done
