name: 🧹 Lint Templates

on:
  pull_request:
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:

jobs:
  lint:
    name: Check template syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget

      - name: Download and extract xbps-static
        run: |
          cd /tmp
          FILE="xbps-static-0.59.1_5.x86_64-musl.tar.gz"
          URL="https://repo-default.voidlinux.org/static/$FILE"

          wget --no-check-certificate -q --show-progress "$URL" -O "$FILE" || \
            { echo "❌ Failed to download xbps-static"; exit 1; }

          # Extract the archive (it contains a top-level directory)
          tar -xzf "$FILE"

          # Copy binaries to /tmp/bin
          mkdir -p /tmp/bin
          cp xbps-static-0.59.1_5.x86_64-musl/bin/xbps-uhelper /tmp/bin/
          cp xbps-static-0.59.1_5.x86_64-musl/bin/xbps-install /tmp/bin/  # optional, for safety

          # Add to PATH
          echo "/tmp/bin" >> $GITHUB_PATH

          # Verify it works
          /tmp/bin/xbps-uhelper --version

      - name: Download xlint.sh
        run: |
          wget https://raw.githubusercontent.com/void-linux/void-packages/master/common/travis/xlint.sh -O xlint.sh
          chmod +x xlint.sh

      - name: Run xlint on changed templates
        run: |
          templates=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'srcpkgs/.*/template' || echo "")
          if [ -n "$templates" ]; then
            echo "🔍 Checking templates:"
            echo "$templates"
            echo "$templates" | xargs ./xlint.sh
          else
            echo "✅ No template files changed."
          fi
