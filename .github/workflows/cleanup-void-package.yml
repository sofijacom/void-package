name: 🗑️ Cleanup Void Package Branch Runs

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  workflow_dispatch:
    inputs:
      min_age_days:
        description: 'Minimum age (in days) of runs to delete'
        required: false
        default: '7'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete old workflow runs on main branch
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: 'main'
        run: |
          MIN_AGE_DAYS="${{ github.event.inputs.min_age_days }}"
          if [ -z "$MIN_AGE_DAYS" ]; then
            MIN_AGE_DAYS=7
          fi

          echo "Fetching runs for branch: $BRANCH older than $MIN_AGE_DAYS day(s)"

          CUTOFF_EPOCH=$(date -d "-${MIN_AGE_DAYS} days" +%s)

          # Declare counters BEFORE the loop
          deleted_count=0
          skipped_count=0

          # Reading line by line without a subshell: using while via redirection, not a pipe
          while IFS=$'\t' read -r run_id created_at; do
            if [ -z "$run_id" ]; then
              continue
            fi

            RUN_EPOCH=$(date -d "$created_at" +%s 2>/dev/null)
            if [ -z "$RUN_EPOCH" ]; then
              echo "Warning: could not parse date for run $run_id, skipping"
              ((skipped_count++)) 2>/dev/null || true
              continue
            fi

            if [ "$RUN_EPOCH" -lt "$CUTOFF_EPOCH" ]; then
              echo "Deleting run ID: $run_id (created: $created_at)"
              if gh api repos/"$OWNER"/"$REPO"/actions/runs/"$run_id" -X DELETE --silent; then
                ((deleted_count++)) 2>/dev/null || true
              else
                echo "Failed to delete run $run_id"
              fi
            else
              echo "Skipping run ID: $run_id (created: $created_at, younger than $MIN_AGE_DAYS days)"
              ((skipped_count++)) 2>/dev/null || true
            fi
          done < <(
            gh run list \
              --repo "$OWNER/$REPO" \
              --branch "$BRANCH" \
              --limit 250 \
              --json databaseId,createdAt \
              --jq '.[] | [.databaseId, .createdAt] | @tsv'
          )

          echo "=== Summary ==="
          echo "Deleted runs: $deleted_count"
          echo "Skipped runs: $skipped_count"
          
