name: 🏗️ Build Packages (xbps)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x86_64, host: x86_64, libc: glibc, platform: linux/amd64 }

    container:
      image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full:20250616R1
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: ${{ matrix.config.arch }}
        XBPS_TARGET_ARCH: ${{ matrix.config.arch }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      # --- Подготовка контейнера ---
      - name: 🧰 Prep container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl grep jq zip unzip git github-cli xtools coreutils
          useradd -G xbuilder -M builder -s $(which bash)

      # --- Клонируем void-packages и применяем свои шаблоны ---
      - name: 🔎 Checkout void-packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages

      - name: 🐛 Fix sourcepkg.sh
        working-directory: void-packages
        run: |
          sed -i 's@for var in $(awk .*;@for var in $(printenv | cut -d'"'"'='"'"' -f1);@' common/environment/setup/sourcepkg.sh

      - name: 🧩 Merge this repository into void-linux/void-packages
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f $REPO_OWNER https://github.com/$REPO_OWNER/$REPO_NAME.git
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change $REPO_OWNER/main
          mkdir -p hostdir/binpkgs

          # Скачиваем старые пакеты, чтобы не терять их
          gh release download --pattern "*${ARCH}*" --dir hostdir/binpkgs --repo $REPO_OWNER/$REPO_NAME || true

          if [ "$ARCH" = "x86_64" ]; then
            rm --force hostdir/binpkgs/*x86_64-musl*
          elif [ "$ARCH" = "x86_64-musl" ]; then
            rm --force hostdir/binpkgs/*x86_64.xbps
          fi
          rm --force hostdir/binpkgs/*.xbps.sig2
          
      # --- Определяем, какие пакеты строить ---
      - name: 📋 Identify changes to build
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.config.arch }}
          SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo $REPO_OWNER/$REPO_NAME || echo "Initial Commit")
          latest_sha=$(git rev-list --max-count=1 ${latest_name} 2>/dev/null || git rev-list --max-parents=0 $REPO_OWNER/main)
          echo "Latest Tag Name: ${latest_name}"
          echo "Latest Tag SHA: ${latest_sha}"

          chown -R builder:builder .
          git diff-tree -r --no-renames --name-only --diff-filter=AM ${latest_sha} ${SHA} -- 'srcpkgs/**' \
          | cut -d/ -f 2 | uniq | xargs sudo -Eu builder ./xbps-src sort-dependencies | tee /tmp/templates

      - name: 🧹 Clean outdated .xbps for changed packages
        working-directory: void-packages
        run: |
          echo "📋 Packages to build:"
          cat /tmp/templates

          for pkg in $(cat /tmp/templates); do
            echo "🔍 Searching for old packages for $pkg..."
            sudo -Eu builder find hostdir/binpkgs -name "${pkg}-*.xbps" -ls

            echo "🧹 Deleting old $pkg .xbps files as builder..."
            sudo -Eu builder find hostdir/binpkgs -name "${pkg}-*.xbps" -exec rm -fv {} + || echo "➡️ No .xbps files to delete"

            echo "🧹 Deleting old $pkg .sig2 files as builder..."
            sudo -Eu builder find hostdir/binpkgs -name "${pkg}-*.sig2" -exec rm -fv {} + || echo "➡️ No .sig2 files to delete"

            echo "✅ Final check — any leftover .xbps files?"
            if sudo -Eu builder find hostdir/binpkgs -name "${pkg}-*.xbps" -ls; then
              echo "❌ Oops: files still exist!"
            else
              echo "➡️ All cleared — good!"
            fi
          done
          
      # --- Настройка xbps-src ---
      - name: 🛠️ Setup void-packages
        working-directory: void-packages
        run: |
          chown -R builder:builder .
          mkdir -p etc
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo 'XBPS_REPOSITORY=$PWD/hostdir/binpkgs' >> etc/conf
          echo 'XBPS_DISTDIR=$PWD/hostdir/distfiles' >> etc/conf
          echo 'XBPS_MASTERDIR_PKGS="$PWD/hostdir/binpkgs"' >> etc/conf

      - name: 🔧 Prepare masterdir
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          chown -R builder:builder .
          yes | sudo -Eu builder ./xbps-src -m masterdir-${ARCH} -A ${ARCH} binary-bootstrap

      - name: ✅ Install gawk in chroot
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          MASTERDIR="masterdir-${ARCH}"
          if [ ! -d "$MASTERDIR" ]; then echo "❌ Error: $MASTERDIR does not exist"; exit 1; fi

          sudo mkdir -p "$MASTERDIR/etc/xbps.d"
          [ -d "/usr/share/xbps.d" ] && sudo cp /usr/share/xbps.d/*-repository-*.conf "$MASTERDIR/etc/xbps.d/" || { echo "❌ Not found /usr/share/xbps.d/"; exit 1; }

          sudo mount --bind /proc "$MASTERDIR/proc" || true
          sudo mount --bind /dev "$MASTERDIR/dev" || true
          sudo mount --bind /sys "$MASTERDIR/sys" || true

          yes | sudo chroot "$MASTERDIR" xbps-install -y gawk || { echo "❌ gawk installation failed"; sudo umount "$MASTERDIR/proc" "$MASTERDIR/dev" "$MASTERDIR/sys" 2>/dev/null; exit 1; }
          { [ -f "$MASTERDIR/usr/bin/awk" ] || [ -f "$MASTERDIR/usr/bin/gawk" ]; } || { echo "❌ awk not found"; sudo umount "$MASTERDIR/proc" "$MASTERDIR/dev" "$MASTERDIR/sys" 2>/dev/null; exit 1; }

          sudo umount "$MASTERDIR/proc" "$MASTERDIR/dev" "$MASTERDIR/sys" 2>/dev/null

      - name: 🗑️ Reset package cache & sync repos
        working-directory: void-packages
        run: sudo -Eu builder ./xbps-src clean || true

      # --- Сборка ---
      - name: 📦 Build pkgs
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          chown -R builder:builder .
          pkgs=$(cat /tmp/templates)
          for pkg in ${pkgs}; do
            echo "🏗️ Building $pkg for $ARCH..."
            sudo -Eu builder ./xbps-src -f pkg -j$(nproc) -m masterdir-${ARCH} -A ${ARCH} "${pkg}" || printf "Failed building ${pkg}!\n"
          done
          
      - name: 📊 Report what was built
        working-directory: void-packages/hostdir/binpkgs
        run: |
          count=$(ls -1 *.xbps 2>/dev/null | wc -l)
          echo "=== Built $count packages ==="
          ls -1 *.xbps | sort
          
      - name: 📦 Sign & Index repo
        working-directory: void-packages/hostdir/binpkgs
        env:
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
          ARCH: ${{ matrix.config.arch }}
        run: |
          set -e
          export PATH="/opt/xbps/usr/bin/:$PATH"

          echo "🗑️ Removing old repodata files..."
          rm -f "${ARCH}-repodata"

          count=$(ls -1 *.xbps 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "⚠️ No .xbps files found. Skipping indexing."
            exit 0
          fi

          echo "✅ Found $count packages. Building new repodata..."
          xbps-rindex -a *.xbps

          if [ -n "$PRIV_KEY" ]; then
            printf "%s\n" "$PRIV_KEY" > private.pem
            chmod 600 private.pem

            xbps-rindex -r "$PWD"
            xbps-rindex -s --signedby "Sofiya <sofiya@v.com>" --privkey private.pem "$PWD"
            xbps-rindex -S --privkey private.pem "$PWD"/*.xbps
            xbps-rindex -c "$PWD"

            rm -f private.pem
          else
            echo "⚠️ No PRIV_KEY — skipping signing."
          fi

          echo "✅ Repodata rebuilt and signed."
          
      - name: 🔢 Checksum
        working-directory: void-packages/hostdir/binpkgs
        run: |
          rm -rf *.sha256sum *.sha512sum
          for file in *.xbps; do
            sha256sum "${file}" | cut -d ' ' -f 1 > "${file}.sha256sum"
            sha512sum "${file}" | cut -d ' ' -f 1 > "${file}.sha512sum"
          done
          
      - name: ⬇️ Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repodata
          path: void-packages/hostdir/binpkgs
          retention-days: 1

      - name: 📤 Upload to Release (fully fixed)
        if: github.ref == 'refs/heads/main'
        working-directory: void-packages/hostdir/binpkgs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ARCH: ${{ matrix.config.arch }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          API="https://api.github.com/repos/$REPO_OWNER/$REPO_NAME"

          # Уникальный тег, чтобы не было конфликтов
          TAG="$ARCH-latest"
          NAME="Binary repo for $ARCH Latest"
          COMMIT_SHA="${{ github.sha }}"

          # Удаляем старый релиз по тегу, если есть
          echo "🔍 Checking for existing release with tag $TAG..."
          EXISTING_RELEASE=$(curl -s -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/$TAG" || echo "")

          if [ -n "$EXISTING_RELEASE" ] && echo "$EXISTING_RELEASE" | jq -e '.id' > /dev/null 2>&1; then
            RELEASE_ID=$(echo "$EXISTING_RELEASE" | jq -r '.id')
            echo "🗑️ Deleting old release ID $RELEASE_ID..."
            curl -s -X DELETE -H "$AUTH" -H "$ACCEPT" "$API/releases/$RELEASE_ID" || true
          fi

          # Создаём новый релиз
          echo "🆕 Creating new release for tag $TAG..."
          CREATE_BODY=$(jq -n --arg tag "$TAG" --arg commit "$COMMIT_SHA" --arg name "$NAME" '
            { tag_name: $tag, target_commitish: $commit, name: $name, draft: false, prerelease: false }
          ')
          NEW_RELEASE=$(curl -s -X POST -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" \
            -d "$CREATE_BODY" "$API/releases")

          RELEASE_ID=$(echo "$NEW_RELEASE" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "❌ Failed to create release"
            echo "$NEW_RELEASE"
            exit 1
          fi

          echo "✅ Release created: ID $RELEASE_ID"

          # Загружаем все файлы
          for file in *.xbps *.sig2 ${ARCH}-repodata; do
            if [ -f "$file" ]; then
              echo "📤 Uploading $file..."
              curl -s -L \
                -X POST \
                -H "$AUTH" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/$REPO_OWNER/$REPO_NAME/releases/$RELEASE_ID/assets?name=$file" \
                --fail
            fi
          done

          echo "🎉 All files uploaded successfully."

          
