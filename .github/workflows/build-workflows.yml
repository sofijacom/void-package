name: 🏗️ Build Packages (Simple Artifact)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x86_64, host: x86_64, libc: glibc, platform: linux/amd64 }

    container:
      image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full:20250616R1
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: ${{ matrix.config.arch }}
        XBPS_TARGET_ARCH: ${{ matrix.config.arch }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      # 1. Подготовка контейнера и пользователя builder
      - name: 🧰 Prep container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl grep jq zip unzip git xtools coreutils
          useradd -G xbuilder -M builder -s $(which bash)

      # 2. Checkout void-packages
      - name: 🔎 Checkout void-packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages

      # 3. Фикс скрипта сборки (частая проблема)
      - name: 🐛 Fix sourcepkg.sh
        working-directory: void-packages
        run: |
          sed -i 's@for var in $(awk .*;@for var in $(printenv | cut -d'"'"'='"'"' -f1);@' common/environment/setup/sourcepkg.sh

      # 4. Слияние твоих шаблонов в void-packages
      - name: 🧩 Merge this repository into void-linux/void-packages
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f $REPO_OWNER https://github.com/$REPO_OWNER/$REPO_NAME.git
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change $REPO_OWNER/main
          mkdir -p hostdir/binpkgs

      # 5. Определение, какие пакеты собирать (только изменённые)
      - name: 📋 Identify changes to build
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.config.arch }}
          SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Пытаемся найти последний тег релиза, если нет — считаем, что изменений нет и собираем всё
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo $REPO_OWNER/$REPO_NAME 2>/dev/null || echo "")
          if [ -n "$latest_name" ]; then
            latest_sha=$(git rev-list --max-count=1 ${latest_name} 2>/dev/null)
          else
            latest_sha=""
          fi

          # Если тега нет или не удалось найти SHA, считаем, что надо собрать всё (Initial Commit)
          if [ -z "$latest_sha" ]; then
            echo "No previous release found, building all packages in srcpkgs/"
            find srcpkgs/ -mindepth 1 -maxdepth 1 -type d -printf "%f\n" > /tmp/templates
          else
            echo "Comparing changes from ${latest_sha} to ${SHA}"
            git diff-tree -r --no-renames --name-only --diff-filter=AM ${latest_sha} ${SHA} -- 'srcpkgs/' \
              | cut -d/ -f 2 | uniq | xargs sudo -Eu builder ./xbps-src sort-dependencies | tee /tmp/templates
          fi

          cat /tmp/templates | grep -v "^$" > /tmp/templates.clean
          mv /tmp/templates.clean /tmp/templates

      # 6. Настройка xbps-src
      - name: 🛠️ Setup void-packages
        working-directory: void-packages
        run: |
          chown -R builder:builder .
          mkdir -p etc
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo 'XBPS_REPOSITORY=$PWD/hostdir/binpkgs' >> etc/conf
          echo 'XBPS_DISTDIR=$PWD/hostdir/distfiles' >> etc/conf
          echo 'XBPS_MASTERDIR_PKGS="$PWD/hostdir/binpkgs"' >> etc/conf

      # 7. Подготовка chroot (masterdir)
      - name: 🔧 Prepare masterdir
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          chown -R builder:builder .
          yes | sudo -Eu builder ./xbps-src -m masterdir-${ARCH} -A ${ARCH} binary-bootstrap

      # 8. Установка gawk внутрь chroot (нужно для некоторых шаблонов)
      - name: ✅ Install gawk in chroot
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          MASTERDIR="masterdir-${ARCH}"
          if [ ! -d "$MASTERDIR" ]; then
            echo "❌ Error: $MASTERDIR does not exist"
            exit 1
          fi
          sudo mkdir -p "$MASTERDIR/etc/xbps.d"
          [ -d "/usr/share/xbps.d" ] && sudo cp /usr/share/xbps.d/*-repository-*.conf "$MASTERDIR/etc/xbps.d/" || true
          sudo mount --bind /proc "$MASTERDIR/proc" || true
          sudo mount --bind /dev "$MASTERDIR/dev" || true
          sudo mount --bind /sys "$MASTERDIR/sys" || true
          yes | sudo chroot "$MASTERDIR" xbps-install -y gawk || true
          sudo umount "$MASTERDIR/proc" "$MASTERDIR/dev" "$MASTERDIR/sys" 2>/dev/null || true

      # 9. Сброс кэша и сборка
      - name: 🗑️ Reset package cache & sync repos
        working-directory: void-packages
        run: sudo -Eu builder ./xbps-src clean || true

      - name: 📦 Build pkgs
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          chown -R builder:builder .
          pkgs=$(cat /tmp/templates)
          # Если список пустой, всё равно пробуем собрать что-то, чтобы не падать
          if [ -z "$pkgs" ]; then
            echo "No changed packages detected, skipping build."
            mkdir -p hostdir/binpkgs
            exit 0
          fi
          for pkg in ${pkgs}; do
            echo "🏗️ Building $pkg for $ARCH..."
            sudo -Eu builder ./xbps-src pkg -j$(nproc) -m masterdir-${ARCH} -A ${ARCH} "${pkg}" || printf "Failed building ${pkg}!\n"
          done

      # 10. Создание repodata и подпись (простая, без сложной логики с релизами)
      - name: 🏁 Create & sign repodata
        working-directory: void-packages/hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          ARCH: ${{ matrix.config.arch }}
        run: |
          rm -f "${ARCH}-repodata"
          # Создаем repodata для всех .xbps файлов
          sudo -Eu builder xbps-rindex -a -f "${ARCH}-repodata" *.xbps || true

          if [ -n "${PRIVKEY}" ]; then
            printf "%s\n" "${PRIVKEY}" > key.pem
            chmod 600 key.pem
            # Подписываем репо и пакеты
            sudo -Eu builder xbps-rindex --privkey key.pem -s --signedby "Void CI Builder" . || true
            sudo -Eu builder xbps-rindex --privkey key.pem -S *.xbps || true
            rm key.pem
          else
            echo "⚠️ No PRIV_KEY found. Repo will be unsigned."
          fi

          ls -lh "${ARCH}-repodata" || echo "No repodata created."

      # 11. Загрузка артефакта (просто папка с пакетами и repodata)
      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.arch }}-repo-artifact
          path: void-packages/hostdir/binpkgs
          retention-days: 7

      - name: 🏷️ short sha
        run: |
          printf "SHORT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV
