name: 🧹 Lint Templates

on:
  pull_request:
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:

jobs:
  lint:
    name: Check template syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget

      - name: Download xbps-static (REAL existing version)
        run: |
          cd /tmp
          # Используем ТОЛЬКО то, что реально есть на сервере
          wget --no-check-certificate -q --show-progress \
            https://repo-default.voidlinux.org/static/xbps-static-0.59.1_5.x86_64-musl.tar.gz \
            -O xbps-static.tar.gz || { echo "❌ Failed to download xbps-static"; exit 1; }

          # Распакуем .tar.gz
          tar -xzf xbps-static.tar.gz -C /tmp
          # Добавим в PATH
          echo "/tmp/bin" >> $GITHUB_PATH

      - name: Download xlint.sh
        run: |
          wget https://raw.githubusercontent.com/void-linux/void-packages/master/common/travis/xlint.sh -O xlint.sh
          chmod +x xlint.sh

      - name: Run xlint on changed templates
        run: |
          templates=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'srcpkgs/.*/template' || echo "")
          if [ -n "$templates" ]; then
            echo "🔍 Checking templates:"
            echo "$templates"
            echo "$templates" | xargs ./xlint.sh
          else
            echo "✅ No template files changed."
          fi
