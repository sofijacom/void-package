name: 🧹 Lint Templates

on:
  pull_request:
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:

jobs:
  lint:
    name: Check template syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget

      - name: Download xbps-static
        run: |
          cd /tmp
          FILE="xbps-static-0.59.1_5.x86_64-musl.tar.gz"
          URL="https://repo-default.voidlinux.org/static/$FILE"

          wget --no-check-certificate -q --show-progress "$URL" -O "$FILE" || \
            { echo "❌ Failed to download xbps-static"; exit 1; }

          # Extract with suppressed warnings
          tar -xzf "$FILE" --warning=no-timestamp --no-same-owner --no-same-permissions 2>/dev/null || true

      - name: Verify xbps-uhelper.static exists
        run: |
          if [ ! -f "/tmp/usr/bin/xbps-uhelper.static" ]; then
            echo "❌ xbps-uhelper.static not found in /tmp/usr/bin/"
            ls -la /tmp/usr/bin/ 2>/dev/null || echo "No files in /tmp/usr/bin/"
            exit 1
          fi

      - name: Create /tmp/bin and copy xbps-uhelper.static as xbps-uhelper
        run: |
          mkdir -p /tmp/bin
          cp /tmp/usr/bin/xbps-uhelper.static /tmp/bin/xbps-uhelper
          echo "/tmp/bin" >> $GITHUB_PATH

      - name: Verify xbps-uhelper works
        run: |
          /tmp/bin/xbps-uhelper -V

      - name: Download xlint.sh
        run: |
          wget https://raw.githubusercontent.com/void-linux/void-packages/master/common/travis/xlint.sh -O xlint.sh
          chmod +x xlint.sh

      - name: Run xlint on changed templates
        run: |
          templates=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'srcpkgs/.*/template' || echo "")
          if [ -n "$templates" ]; then
            echo "🔍 Checking templates:"
            echo "$templates"
            echo "$templates" | xargs ./xlint.sh
          else
            echo "✅ No template files changed."
          fi
