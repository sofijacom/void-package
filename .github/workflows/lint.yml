name: 🧹 Lint Templates

on:
  pull_request:
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:

jobs:
  lint:
    name: Check template syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install xbps and xlint
        run: |
          sudo apt update
          sudo apt install -y xbps
          wget https://raw.githubusercontent.com/void-linux/void-packages/master/common/travis/xlint.sh -O xlint.sh
          chmod +x xlint.sh

      - name: Find changed templates
        id: find_templates
        run: |
          templates=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'srcpkgs/.*/template' || echo "")
          if [ -n "$templates" ]; then
            echo "templates=$templates" >> $GITHUB_OUTPUT
            echo "Found templates to check:"
            echo "$templates"
          else
            echo "No template files changed."
          fi

      - name: Run xlint on changed templates
        if: steps.find_templates.outputs.templates != ''
        run: |
          echo "${{ steps.find_templates.outputs.templates }}" | xargs ./xlint.sh
