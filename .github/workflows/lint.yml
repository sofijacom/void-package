name: 🧹 Lint Templates

on:
  pull_request:
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:

jobs:
  lint:
    name: Check template syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget xz-utils

      - name: Download xbps-static (bypass SSL if needed)
        run: |
          cd /tmp
          # Попробуем сначала с проверкой сертификата
          if wget -q --show-progress https://alpha.de.repo.voidlinux.org/static/xbps-static-0.64_1.x86_64-musl.tar.xz -O xbps.tar.xz; then
            echo "✅ xbps-static downloaded securely"
          else
            echo "⚠️ SSL failed, retrying with --no-check-certificate..."
            rm -f xbps.tar.xz
            wget --no-check-certificate -q --show-progress https://alpha.de.repo.voidlinux.org/static/xbps-static-0.64_1.x86_64-musl.tar.xz -O xbps.tar.xz || \
            { echo "❌ Failed to download xbps-static"; exit 1; }
          fi

          # Распакуем
          tar -xf xbps.tar.xz -C /tmp
          export PATH="/tmp/bin:$PATH"
          echo "PATH=/tmp/bin:$PATH" >> $GITHUB_ENV

      - name: Download xlint.sh
        run: |
          wget https://raw.githubusercontent.com/void-linux/void-packages/master/common/travis/xlint.sh -O xlint.sh
          chmod +x xlint.sh

      - name: Run xlint on changed templates
        run: |
          templates=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'srcpkgs/.*/template' || echo "")
          if [ -n "$templates" ]; then
            echo "🔍 Checking templates:"
            echo "$templates"
            echo "$templates" | xargs ./xlint.sh
          else
            echo "✅ No template files changed."
          fi
